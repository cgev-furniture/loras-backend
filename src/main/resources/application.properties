spring.application.name=loras-backend

# DataSource (Cloud SQL via socket factory)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=300000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable multipart (uploads go directly to GCS via signed URLs)
spring.servlet.multipart.enabled=false

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.port=8080

# App-specific properties
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.cookie-domain=${JWT_COOKIE_DOMAIN:localhost}
app.gcs.bucket-name=${GCS_BUCKET_NAME}
app.contact.email=${CONTACT_EMAIL:asryantigran@gmail.com}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Structured logging (ECS format for Cloud Logging)
logging.structured.format.console=ecs
